context:
  version: "0.19.1"

package:
  name: otfmi
  version: ${{ version }}

source:
  url: https://github.com/openturns/otfmi/archive/v${{ version }}.tar.gz
  sha256: cb3ddeda7cbd9bed29bc9d54dda9846f2a67031d748ce853f1b9974b9b05fb30

build:
  noarch: python
  number: 0
  script: pip install . --no-deps -vv

requirements:
  host:
    - pip
    - hatchling 
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}
    - openturns
    - pyfmi
    - assimulo
    - pythonfmu
    - jinja2
    - dill

tests:
  - python:
      imports:
        - otfmi
      python_version: ${{ python_min }}.*

about:
  homepage: http://openturns.org/
  license: LGPL-3.0-or-later
  license_family: LGPL
  license_file: COPYING.LESSER
  summary: FMI models manipulation module
  documentation: https://openturns.github.io/otfmi/master/
  repository: https://github.com/openturns/otfmi

extra:
  recipe-maintainers:
    - jschueller
